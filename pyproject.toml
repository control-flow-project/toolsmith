[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "ctlflow-toolsmith"
version = "0.1.0"
description = "Optional generic libraries and CLI tools; no services or helper processes"
readme = "README.md"
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "Jeswin P Kumar", email = "jeswinpk@agilehead.com" }]
classifiers = ["Private :: Do Not Upload"]
dependencies = []

[project.optional-dependencies]
http = ["dnspython==2.8.0"]

[project.scripts]
toolsmith = "toolsmith.cli:main"

[dependency-groups]
dev = ["hatchling==1.32.4", "build==1.6.1", "mypy==2.4.0", "pytest==9.1.1", "ruff>=0.15,<0.17", "pip-audit==2.10.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/toolsmith"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "scripts", "AGENTS.md", "LICENSE", "README.md", "pyproject.toml", "uv.lock"]

[tool.uv]
exclude-newer = "2026-10-04T00:00:00Z"

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
files = ["src", "tests", "scripts"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
