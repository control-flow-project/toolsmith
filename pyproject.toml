[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "ctlflow-toolsmith"
version = "0.5.0"
description = "Optional generic libraries and CLI tools; no services or helper processes"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jeswin P Kumar", email = "jeswinpk@agilehead.com" }]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.urls]
Repository = "https://github.com/control-flow-project/toolsmith"
Documentation = "https://github.com/control-flow-project/toolsmith/tree/main/docs"
Issues = "https://github.com/control-flow-project/toolsmith/issues"

[project.optional-dependencies]
http = ["dnspython==2.8.0", "aiohttp==3.14.5"]
xls = ["xlrd==2.0.2"]
pdf = ["pypdfium2==5.14.0", "Pillow==13.0.0"]
semantic = ["onnxruntime==1.30.0", "tokenizers==0.23.2"]

[project.scripts]
toolsmith = "toolsmith.cli:main"

[dependency-groups]
dev = ["hatchling==1.32.4", "build==1.6.1", "mypy==2.4.0", "pytest==9.1.1", "ruff>=0.15,<0.17", "pip-audit==2.10.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/toolsmith"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "scripts", "examples", "vendor", "hatch_build.py", "AGENTS.md", "LICENSE", "README.md", "pyproject.toml", "uv.lock"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.uv]
exclude-newer = "2026-10-17T00:00:00Z"
constraint-dependencies = ["certifi==2026.10.19", "filelock==4.2.1"]

[tool.uv.exclude-newer-package]
certifi = "2026-10-25T00:00:00Z"
filelock = "2026-10-25T00:00:00Z"

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
files = ["src", "tests", "scripts", "hatch_build.py"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
